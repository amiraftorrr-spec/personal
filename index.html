<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== Basic SEO ===== -->
    <title>aftor | Frontend Developer Portfolio</title>
    <meta
      name="description"
      content="AmirAftor is a Frontend Developer crafting modern, interactive and visually engaging web experiences with React, Next.js, Tailwind CSS and GSAP."
    />
    <meta
      name="keywords"
      content="AmirAftor, aftor, Frontend Developer, React Developer, Next.js, Tailwind CSS, GSAP, Web Developer Portfolio"
    />
    <meta name="author" content="AmirAftor" />
    <meta name="robots" content="index, follow" />

    <!-- ===== Canonical URL (آدرس اصلی دامنه‌ت رو اینجا جایگزین کن) ===== -->
    <link rel="canonical" href="https://aftor.ir/" />

    <!-- ===== Open Graph (پیش‌نمایش تو تلگرام، واتساپ، فیسبوک، لینکدین) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="aftor | Frontend Developer Portfolio" />
    <meta
      property="og:description"
      content="Frontend Developer crafting modern, interactive and visually engaging web experiences with React, Next.js, Tailwind CSS and GSAP."
    />
    <meta property="og:image" content="https://your-domain.com/og-image.jpg" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:site_name" content="aftor" />
    <meta property="og:locale" content="en_US" />

    <!-- ===== Twitter Card ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="aftor | Frontend Developer Portfolio" />
    <meta
      name="twitter:description"
      content="Frontend Developer crafting modern, interactive and visually engaging web experiences with React, Next.js, Tailwind CSS and GSAP."
    />
    <meta name="twitter:image" content="https://your-domain.com/og-image.jpg" />

    <!-- ===== Favicon & Theme ===== -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#111111" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
